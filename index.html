<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Tree Directory</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Spectral:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --paper:#f1ede2;
    --paper-dark:#e6e0d0;
    --ink:#26301f;
    --bark:#5b4632;
    --leaf:#3d5c3a;
    --leaf-deep:#243d24;
    --gold:#a67c3d;
    --line:#c9c0a8;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, rgba(61,92,58,0.06), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:'Spectral', Georgia, serif;
    padding:32px 16px 80px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1c2118; --paper-dark:#242b1f; --ink:#e9e4d6; --bark:#c8b89a;
      --leaf:#7fa876; --leaf-deep:#a9cf9e; --gold:#d3ac6d; --line:#3c4433;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1c2118; --paper-dark:#242b1f; --ink:#e9e4d6; --bark:#c8b89a;
    --leaf:#7fa876; --leaf-deep:#a9cf9e; --gold:#d3ac6d; --line:#3c4433;
  }
  .wrap{max-width:640px;margin:0 auto;}

  .masthead{
    text-align:center;
    margin-bottom:28px;
    padding-bottom:20px;
    border-bottom:2px solid var(--ink);
  }
  .masthead .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--leaf-deep);
    margin-bottom:8px;
  }
  .masthead h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:34px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .masthead p{
    font-style:italic;
    color:var(--bark);
    margin:8px 0 0;
    font-size:14.5px;
  }

  /* ---- Index view ---- */
  .index-list{display:flex;flex-direction:column;gap:12px;}
  .index-item{
    display:block;
    background:var(--paper-dark);
    border:1px solid var(--line);
    padding:16px 18px;
    text-decoration:none;
    color:var(--ink);
  }
  .index-item .name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
  }
  .index-item .sci{font-style:italic;color:var(--bark);font-size:13.5px;}
  .index-item .meta{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--gold);
    margin-top:6px;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--bark);
    font-style:italic;
    border:1px dashed var(--line);
  }

  /* ---- Single tree card ---- */
  .card{
    background:var(--paper);
    border:1px solid var(--ink);
    padding:32px 28px;
    position:relative;
  }
  .card::before{
    content:attr(data-id);
    position:absolute;
    top:14px;
    right:16px;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.1em;
    color:var(--gold);
  }
  .card .common{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:34px;
    margin:0;
  }
  .card .sci{
    font-style:italic;
    color:var(--bark);
    font-size:16px;
    margin:2px 0 2px;
  }
  .card .fam{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--bark);
    text-transform:uppercase;
  }
  .divider{border:none;border-top:1px solid var(--line);margin:18px 0;}

  .stat-row{display:flex;gap:28px;margin-bottom:20px;}
  .stat .num{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:32px;
    line-height:1;
  }
  .stat .num sup{font-size:14px;font-weight:500;margin-left:2px;}
  .stat .lbl{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--bark);
    margin-top:4px;
  }

  dl{margin:0 0 18px;}
  dl .row{display:flex;padding:7px 0;border-bottom:1px dotted var(--line);}
  dl dt{
    width:150px;
    flex-shrink:0;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.03em;
    color:var(--bark);
  }
  dl dd{margin:0;font-size:14.5px;}

  .section-title{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--leaf-deep);
    margin:20px 0 8px;
  }
  ul.facts{margin:0 0 4px;padding-left:20px;}
  ul.facts li{font-size:14.5px;margin-bottom:8px;line-height:1.5;}

  .back-link{
    display:inline-block;
    margin-top:24px;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.05em;
    color:var(--leaf-deep);
    text-decoration:none;
    border-bottom:1px solid var(--leaf-deep);
  }
</style>
</head>

function esc(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderCard(id, t){
  return `
    <div class="masthead">
      <div class="eyebrow">Campus Tree Directory</div>
      <h1>${esc(t.name)}</h1>
    </div>
    <div class="card" data-id="${esc(id)}">
      <p class="common">${esc(t.name)}</p>
      <p class="sci">${esc(t.sci)}</p>
      <p class="fam">(${esc(t.fam)})</p>
      <hr class="divider">
      <div class="stat-row">
        <div class="stat">
          <div class="num">${esc(String(t.age))}</div>
          <div class="lbl">Years Age</div>
        </div>
        <div class="stat">
          <div class="num">${t.carbon.toFixed(2)} <sup>kg C</sup></div>
          <div class="lbl">Total Carbon Stock</div>
        </div>
      </div>
      <dl>
        <div class="row"><dt>Individual Number</dt><dd>${esc(id)}</dd></div>
        <div class="row"><dt>Family</dt><dd>${esc(t.fam)}</dd></div>
        <div class="row"><dt>Native Region</dt><dd>${esc(t.region)}</dd></div>
        <div class="row"><dt>IUCN Status</dt><dd>${esc(t.iucn)}</dd></div>
      </dl>
      <div class="section-title">Ecological Importance</div>
      <ul class="facts">${t.eco.map(f=>'<li>'+esc(f)+'</li>').join('')}</ul>
      <div class="section-title">Economic Importance</div>
      <ul class="facts">${t.econ.map(f=>'<li>'+esc(f)+'</li>').join('')}</ul>
    </div>
    <a class="back-link" href="${location.pathname}">&larr; View all trees</a>
  `;
}

function renderIndex(){
  const ids = Object.keys(TREES);
  let body;
  if(ids.length === 0){
    body = '<div class="empty">No trees added yet. Check back soon — this directory grows as each tree on campus gets tagged.</div>';
  }else{
    body = '<div class="index-list">' + ids.map(id=>{
      const t = TREES[id];
      return `<a class="index-item" href="?id=${encodeURIComponent(id)}">
        <div class="name">${esc(t.name)}</div>
        <div class="sci">${esc(t.sci)}</div>
        <div class="meta">No. ${esc(id)} &middot; ${esc(String(t.age))} yrs &middot; ${t.carbon.toFixed(1)} kg C</div>
      </a>`;
    }).join('') + '</div>';
  }
  return `
    <div class="masthead">
      <div class="eyebrow">Campus Tree Directory</div>
      <h1>All Trees</h1>
      <p>Scan a plaque, or browse the full list below</p>
    </div>
    ${body}
  `;
}

const params = new URLSearchParams(location.search);
const id = params.get('id');
const app = document.getElementById('app');

if(id && TREES[id]){
  app.innerHTML = renderCard(id, TREES[id]);
}else if(id){
  app.innerHTML = `
    <div class="masthead">
      <div class="eyebrow">Campus Tree Directory</div>
      <h1>Tree not found</h1>
      <p>No record exists for ID "${esc(id)}" yet.</p>
    </div>
    <a class="back-link" href="${location.pathname}">&larr; View all trees</a>
  `;
}else{
  app.innerHTML = renderIndex();
}
</script>
